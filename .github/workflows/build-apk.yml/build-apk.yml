
name: Build Excalibur APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract project
        run: |
          mkdir source
          unzip -o Excalibur.zip -d source
          find source -maxdepth 3 -type f | head -50

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build APK
        run: |
          cd source
          gradle assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: Excalibur-APK
          path: source/**/build/outputs/apk/debug/*.apk
          
